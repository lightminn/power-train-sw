# Opt-in integrated-operation overlay. Use together with docker-compose.jetson.yml.
# Images and the ROS install space must already be prepared by robot_prepare.sh.
services:
  powertrain_ros:
    restart: unless-stopped
    environment:
      - POWERTRAIN_OPERATOR_SESSION_FILE=/run/powertrain/operator-session.json
      # SRT output rate, 15 (field default) or 30. Camera, depth and ROS topics keep their rates.
      - L515_SRT_FPS=${L515_SRT_FPS:-15}
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -e
        test -f /workspace/ros2/install/setup.bash
        source /opt/ros/humble/setup.bash
        source /workspace/ros2/install/setup.bash
        set -u
        cd /workspace
        exec python3 -m l515_dashboard.gateway_main

  powertrain_control:
    environment:
      - PYTHONPATH=/workspace:/workspace/ros2/src/powertrain_ros:/workspace/motor_control
      - POWERTRAIN_OPERATOR_SESSION_FILE=/run/powertrain/operator-session.json
      # Field teleop policy (see command). Host env/.env overrides reach the container.
      - TELEOP_INPUT_TIMEOUT_S=${TELEOP_INPUT_TIMEOUT_S:-0.5}
      - TELEOP_LATCH_STALE_INPUT=${TELEOP_LATCH_STALE_INPUT:-false}
      - TELEOP_PARTIAL_CLOSE_VIOLATION=${TELEOP_PARTIAL_CLOSE_VIOLATION:-false}
    command:
      - |
        set -e
        PYTHONPATH=/workspace/ros2/src/powertrain_ros python3 -m powertrain_ros.preflight
        test -f /workspace/ros2/install/setup.bash
        source /opt/ros/humble/setup.bash
        source /workspace/ros2/install/setup.bash
        set -u
        exec ros2 launch powertrain_ros control.launch.py input_host:=127.0.0.1 input_port:=19000 ops_host:=127.0.0.1 ops_port:=19001 input_timeout_s:=$${TELEOP_INPUT_TIMEOUT_S:-0.5} latch_stale_input:=$${TELEOP_LATCH_STALE_INPUT:-false} partial_close_violation:=$${TELEOP_PARTIAL_CLOSE_VIOLATION:-false}
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "rows=[r.split() for r in open('/proc/net/tcp').read().splitlines()[1:]]; listening={r[1] for r in rows if r[3]=='0A'}; assert {'0100007F:4A38','0100007F:4A39'} <= listening"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  powertrain_chassis:
    environment:
      - POWERTRAIN_PROFILE=can-4ws
      # Demo switch (docs/specs/2026-11-06-demo-mode.md); scripts/robot-start sets it.
      - POWERTRAIN_DEMO_MODE=${POWERTRAIN_DEMO_MODE:-false}
    command:
      - |
        set -e
        DEMO_MODE="$${POWERTRAIN_DEMO_MODE:-false}"
        case "$$DEMO_MODE" in true|false) ;; *) echo "invalid POWERTRAIN_DEMO_MODE" >&2; exit 1 ;; esac
        PYTHONPATH=/workspace/ros2/src/powertrain_ros python3 -m powertrain_ros.preflight
        set -a; . /etc/powertrain/powertrain.env; set +a
        test -n "$$STOP_MM"
        test -f /workspace/ros2/install/setup.bash
        source /opt/ros/humble/setup.bash
        source /workspace/ros2/install/setup.bash
        set -u
        exec ros2 launch powertrain_ros wp5_control.launch.py stop_mm:=$$STOP_MM authority_enabled:=true demo_mode:=$$DEMO_MODE

  powertrain_observability:
    environment:
      - POWERTRAIN_OPERATOR_SESSION_FILE=/run/powertrain/operator-session.json

  powertrain_chassis_telemetry:
    # This observer must not inherit the ROS image's camera-owner healthcheck.
    # Its own data freshness is reported by the console's UDP receiver.
    healthcheck:
      disable: true
    image: powertrain-sw:ros
    container_name: powertrain_chassis_telemetry
    network_mode: host
    ipc: host
    environment:
      - PYTHONPATH=/workspace:/workspace/ros2/src/powertrain_ros:/workspace/motor_control
      - POWERTRAIN_OPERATOR_SESSION_FILE=/run/powertrain/operator-session.json
    volumes:
      - ../:/workspace:ro
      - type: bind
        source: /run/powertrain
        target: /run/powertrain
        bind:
          create_host_path: false
    working_dir: /workspace
    entrypoint: [/bin/bash, -lc]
    command:
      - |
        set -e
        test -f /workspace/ros2/install/setup.bash
        source /opt/ros/humble/setup.bash
        source /workspace/ros2/install/setup.bash
        set -u
        exec ros2 run powertrain_ros chassis_telemetry --ros-args -p operator_host:=127.0.0.1 -p operator_port:=5005
    restart: unless-stopped

  powertrain_pdist80b_telemetry:
    healthcheck:
      disable: true
    image: powertrain-sw:ros
    container_name: powertrain_pdist80b_telemetry
    network_mode: host
    privileged: true
    environment:
      - PYTHONPATH=/workspace:/workspace/ros2/src/powertrain_ros
      - POWERTRAIN_OPERATOR_SESSION_FILE=/run/powertrain/operator-session.json
    volumes:
      - ../:/workspace:ro
      - /dev:/dev
      - type: bind
        source: /run/powertrain
        target: /run/powertrain
        bind:
          create_host_path: false
    working_dir: /workspace
    entrypoint: [python3, -u, scripts/pdist80b_telemetry_sender.py]
    command: [--operator-host, 127.0.0.1, --operator-port, "5004", --port, /dev/powertrain-pdist80b, --device-id, "1", --hz, "2.0", --include-unit-status]
    restart: unless-stopped

  # Read-only D435 detection metadata (:5003) and arm state (:5007). The
  # profile is opt-in because the separately owned arm/D435 stack must first
  # be prepared and its legacy metadata_sender must be disabled.
  powertrain_arm_console_bridge:
    healthcheck:
      disable: true
    profiles: [arm-d435]
    image: powertrain-sw:ros
    container_name: powertrain_arm_console_bridge
    network_mode: host
    ipc: host
    environment:
      - PYTHONPATH=/workspace:/workspace/ros2/src/powertrain_ros
      - POWERTRAIN_OPERATOR_SESSION_FILE=/run/powertrain/operator-session.json
    volumes:
      - ../:/workspace:ro
      - type: bind
        source: /run/powertrain
        target: /run/powertrain
        bind:
          create_host_path: false
    working_dir: /workspace
    entrypoint: [/bin/bash, -lc]
    command:
      - |
        set -e
        test -f /workspace/ros2/install/setup.bash
        source /opt/ros/humble/setup.bash
        source /workspace/ros2/install/setup.bash
        set -u
        exec ros2 run powertrain_ros arm_console_bridge --ros-args -p console_host:=127.0.0.1
    restart: unless-stopped

  # L515 terrain obstacle outlines → operator console UDP :5009. Operator
  # visual aid only (no control/safety input). Opt-in profile: not part of
  # scripts/robot-start until the two-encoder load check (spec §7.3-2) passes.
  powertrain_terrain_overlay:
    healthcheck:
      disable: true
    profiles: [terrain-overlay]
    image: powertrain-sw:ros
    container_name: powertrain_terrain_overlay
    network_mode: host
    ipc: host
    cpus: 1.0
    mem_limit: 512m
    environment:
      - PYTHONPATH=/workspace:/workspace/ros2/src/powertrain_ros
      - POWERTRAIN_OPERATOR_SESSION_FILE=/run/powertrain/operator-session.json
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
    volumes:
      - ../:/workspace:ro
      - type: bind
        source: /run/powertrain
        target: /run/powertrain
        bind:
          create_host_path: false
    working_dir: /workspace
    entrypoint: [/bin/bash, -lc]
    command:
      - |
        set -e
        test -f /workspace/ros2/install/setup.bash
        source /opt/ros/humble/setup.bash
        source /workspace/ros2/install/setup.bash
        set -u
        exec ros2 run powertrain_ros terrain_overlay --ros-args -p operator_host:=127.0.0.1 -p operator_port:=5009
    restart: unless-stopped

  # L515 2.5D terrain map → operator console UDP :5010 (spec 2026-10-17-l515-terrain-map-design §8).
  # Operator visual aid only: subscribes to /l515/* and /wheel_states, publishes nothing to ROS.
  # Opt-in profile: not part of scripts/robot-start until the field load check (spec §7.3-3) passes.
  powertrain_terrain_map:
    healthcheck:
      disable: true
    profiles: [terrain-map]
    image: powertrain-sw:ros
    container_name: powertrain_terrain_map
    network_mode: host
    ipc: host
    cpus: 1.0
    mem_limit: 768m
    environment:
      - PYTHONPATH=/workspace:/workspace/ros2/src/powertrain_ros
      - POWERTRAIN_OPERATOR_SESSION_FILE=/run/powertrain/operator-session.json
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
    volumes:
      - ../:/workspace:ro
      - type: bind
        source: /run/powertrain
        target: /run/powertrain
        bind:
          create_host_path: false
    working_dir: /workspace
    entrypoint: [/bin/bash, -lc]
    command:
      - |
        set -e
        test -f /workspace/ros2/install/setup.bash
        source /opt/ros/humble/setup.bash
        source /workspace/ros2/install/setup.bash
        set -u
        exec ros2 run powertrain_ros terrain_map --ros-args -p operator_host:=127.0.0.1 -p operator_port:=5010
    restart: unless-stopped

  powertrain_session:
    image: powertrain-sw:ros
    container_name: powertrain_session
    network_mode: host
    environment:
      - PYTHONPATH=/workspace
    volumes:
      - ../:/workspace:ro
      - type: bind
        source: /run/powertrain
        target: /run/powertrain
        bind:
          create_host_path: false
      - type: bind
        source: /etc/powertrain
        target: /etc/powertrain
        read_only: true
        bind:
          create_host_path: false
    working_dir: /workspace
    entrypoint: [/bin/bash, -lc]
    command:
      - exec python3 -m powertrain_runtime.robot_service --config /etc/powertrain/robot.json
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "rows=[r.split() for r in open('/proc/net/tcp').read().splitlines()[1:]]; ports={r[1].rsplit(':',1)[1] for r in rows if r[3]=='0A'}; assert {'2328','2329','232A'} <= ports"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Field stopgap (2026-11-03): clear MOTOR_FAILED (e.g. node15 CURRENT_LIMIT_VIOLATION)
  # on IDLE drive axes so the operator can start driving again. Never re-arms and never
  # clears ESTOP_REQUESTED or the CAN recovery latch. Opt-in profile, not in robot-start.
  powertrain_odrive_autoclear:
    healthcheck:
      disable: true
    profiles: [odrive-autoclear]
    image: powertrain-sw:ros
    container_name: powertrain_odrive_autoclear
    network_mode: host
    environment:
      - PYTHONPATH=/workspace/motor_control
    volumes:
      - ../:/workspace:ro
    working_dir: /workspace
    entrypoint: [/bin/bash, -lc]
    command:
      - exec python3 -u -m drive.bl70200.odrive_auto_clear --channel can0
    restart: unless-stopped

  # Demo-mode clearer (docs/specs/2026-11-06-demo-mode.md D1). Started and
  # stopped only by scripts/robot-start with POWERTRAIN_DEMO_MODE; never runs
  # together with powertrain_odrive_autoclear. It reads motor.error first and
  # clears MOTOR_FAILED/watchdog only for CURRENT_LIMIT_VIOLATION (or none).
  powertrain_demo_autoclear:
    healthcheck:
      disable: true
    profiles: [demo]
    image: powertrain-sw:ros
    container_name: powertrain_demo_autoclear
    network_mode: host
    environment:
      - PYTHONPATH=/workspace/motor_control
    volumes:
      - ../:/workspace:ro
    working_dir: /workspace
    entrypoint: [/bin/bash, -lc]
    command:
      - exec python3 -u -m drive.bl70200.odrive_auto_clear --channel can0 --mask 0x840 --motor-allow 0x1000
    restart: unless-stopped
