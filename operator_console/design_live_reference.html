<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
:root{--bg:#03050c;--glass:rgba(255,255,255,.045);--line:rgba(255,255,255,.11);--text:#eaeef9;--sub:#98a2c4;--muted:#646e96;--indigo:#4c6fff;--violet:#8b5cf6;--cyan:#3ed8e8;--green:#33d6a6;--red:#9b2850}
*{box-sizing:border-box}body{margin:0;background:#000;color:var(--text);font-family:Pretendard,"Noto Sans KR",sans-serif}.screen{width:1600px;height:1000px;padding:22px 30px 24px;background:radial-gradient(circle at 89% 0,rgba(112,82,240,.24),transparent 30%),radial-gradient(circle at 0 100%,rgba(46,92,225,.18),transparent 34%),linear-gradient(160deg,#050813,var(--bg) 56%,#04060f)}
header{height:58px;display:flex;align-items:flex-start}h1{font-size:20.5px;margin:2px 0;letter-spacing:-.025em}.health{margin-left:auto;display:flex;gap:19px;align-items:center;color:var(--sub);font-size:11px;font-weight:700}.health span{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 12px rgba(51,214,166,.55)}.estop{border:0;border-radius:7px;background:#721d40;color:white;padding:9px 20px;margin:-4px 0 0 22px;font-weight:900;box-shadow:0 0 30px rgba(255,50,104,.25)}
.tabs{display:flex;gap:4px;width:max-content;padding:3px;border:1px solid var(--line);border-radius:7px;background:rgba(8,12,24,.6);margin-bottom:14px}.tab{padding:9px 27px;border:0;border-radius:5px;background:transparent;color:var(--muted);font-weight:800}.active{background:#26316c;color:white;box-shadow:0 0 20px rgba(76,111,255,.28)}
.body{height:790px;display:grid;grid-template-columns:1fr 330px;gap:14px}.camera{position:relative;overflow:hidden;background:radial-gradient(ellipse at 48% 54%,rgba(46,92,225,.19),transparent 48%),linear-gradient(180deg,#050a16,#02040a);mask-image:linear-gradient(to bottom,transparent 0,#000 4%,#000 94%,transparent 100%)}.camera:before{content:"";position:absolute;inset:8%;background:radial-gradient(ellipse,rgba(69,105,210,.12),transparent 64%)}.camtag{position:absolute;top:18px;left:20px;color:var(--sub);font-size:11px;font-weight:750;display:flex;gap:8px;align-items:center}.reticle{position:absolute;left:50%;top:53%;width:270px;height:210px;translate:-50% -50%;border:1px solid rgba(76,111,255,.24)}.reticle:before,.reticle:after{content:"";position:absolute;background:rgba(76,111,255,.48)}.reticle:before{width:1px;height:100%;left:50%}.reticle:after{height:1px;width:100%;top:50%}.waiting{position:absolute;left:50%;bottom:100px;translate:-50%;font:11px "JetBrains Mono",monospace;color:var(--muted);letter-spacing:.18em}.pip{position:absolute;right:26px;bottom:28px;width:310px;height:176px;border-radius:7px;border:1px solid rgba(255,255,255,.14);background:radial-gradient(circle,rgba(139,92,246,.17),#080b15 70%);box-shadow:0 20px 52px rgba(0,0,0,.52),inset 0 1px rgba(255,255,255,.18)}.pip span{position:absolute;left:12px;top:10px;color:var(--sub);font-size:10px}.pip b{position:absolute;left:50%;top:50%;translate:-50% -50%;font-size:11px;color:var(--muted)}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:9px;box-shadow:0 28px 70px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.20),inset 0 -18px 34px rgba(46,92,225,.07)}.rail{padding:14px;display:flex;flex-direction:column;gap:10px}.section{padding:13px;border-bottom:1px solid var(--line)}.section:last-child{border:0}.title{font-size:10px;color:var(--muted);font-weight:750}.devices{display:grid;gap:11px;margin-top:13px}.device{display:flex;align-items:center;gap:8px;font-size:11px}.device i{width:6px;height:6px;border-radius:50%;background:var(--green)}.device em{margin-left:auto;color:var(--sub);font-style:normal;font-size:10px}.mission{font-size:12px;line-height:2;color:var(--sub)}.mission b{color:var(--text);font-weight:800}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:12px 10px;background:rgba(255,255,255,.026);border-radius:7px}.metric label{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;margin-top:8px;font:600 13px "JetBrains Mono",monospace;color:var(--cyan)}.options{margin-top:auto;display:flex;gap:15px;color:var(--sub);font-size:10px}.check{width:24px;height:12px;border-radius:9px;background:var(--indigo);display:inline-block;vertical-align:-2px;margin-right:5px;position:relative}.check:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:white;right:2px;top:2px}.events{position:absolute;left:30px;right:30px;bottom:20px;height:35px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;padding:11px 12px}
</style></head><body><main class="screen"><header><h1>재난 대응 로봇 관제 시스템</h1><div class="health"><span><i class="dot"></i>로봇 연결</span><span><i class="dot"></i>전원</span><span><i class="dot"></i>카메라</span><span><i class="dot"></i>안전 장치</span></div><button class="estop">긴급 정지<br><small>E-STOP</small></button></header><nav class="tabs"><button class="tab active">실시간 화면</button><button class="tab">로봇 상태</button></nav><section class="body"><div class="camera"><div class="camtag"><i class="dot"></i>전방 카메라 · L515 &nbsp; LIVE</div><div class="reticle"></div><div class="waiting">LIVE FEED</div><div class="pip"><span>작업 카메라 · D435i</span><b>클릭하여 크게 보기</b></div></div><aside class="rail glass"><div class="section"><div class="title">주요 장치 · 4 / 4</div><div class="devices"><div class="device"><i></i>전방 카메라 · L515<em>정상</em></div><div class="device"><i></i>작업 카메라 · D435i<em>정상</em></div><div class="device"><i></i>주행 시스템<em>운용 중</em></div><div class="device"><i></i>안전 장치<em>정상</em></div></div></div><div class="section mission"><div class="title">현재 임무</div><b>현재 단계</b> &nbsp; 대상 접근<br><b>작업 대상</b> &nbsp; relief_box</div><div class="metrics"><div class="metric"><label>인식 대상</label><strong>relief_box</strong></div><div class="metric"><label>대상 거리</label><strong>1.42 m</strong></div></div><div class="section mission"><div class="title">엔드이펙터</div><b>범용 그리퍼</b><br><span style="color:var(--muted)">잡기 · 누르기 · 밀기</span></div><div class="options"><span><i class="check"></i>인식 대상</span><span><i class="check"></i>대상 거리</span></div></aside></section><div class="events">이벤트 기록 &nbsp; · &nbsp; 19:42:08 &nbsp; 모든 필수 장치 연결 완료</div></main></body></html>
